spring.application.name=stock-insight-api



spring.datasource.url=jdbc:h2:file:${user.home}/Desktop/stock_insight/DB/stock_insight;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JWT (???)
jwt.secret=CHANGE_ME_TO_LONG_RANDOM_STRING_CHANGE_ME_TO_LONG_RANDOM_STRING
jwt.expiration-seconds=3600


openai:
    openai.api-key=${OPENAI_API_KEY}
    openai.model=gpt-5-nano
