<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports | Stock Insight</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="site-header">
    <a href="/index.html" class="logo">SI<span>•</span> Stock Insight</a>
    <nav class="nav desktop-only">
        <a href="/index.html">Main</a>
        <a href="/reports.html" class="auth-user hidden active">Reports</a>
        <a href="/posts.html" class="auth-user hidden">Board</a>
    </nav>
    <div class="nav-actions">
        <div class="auth-guest" style="display: flex; gap: 0.5rem;">
            <a class="button ghost" href="/login.html">Login</a>
        </div>
        <div class="auth-user hidden" style="display: flex; gap: 0.5rem;">
            <span id="userNameDisplay" style="align-self:center; font-weight:600; margin-right:0.5rem; color:var(--primary);"></span>
            <button class="button ghost" onclick="logout()">Logout</button>
        </div>
        <button id="menuToggle" class="menu-toggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>
</header>

<nav id="mobileMenu" class="mobile-nav">
    <a href="/index.html">Main</a>
    <a href="/reports.html" class="auth-user hidden">Reports</a>
    <a href="/posts.html" class="auth-user hidden">Board</a>
</nav>

<main class="page">
    <section class="panel">
        <div class="panel-header">
            <h2>리포트 생성</h2>
            <p>분석하고 싶은 주식의 티커(Ticker)를 입력하세요.</p>
        </div>
        <form id="reportGenerateForm" class="form two-column">
            <label>종목 티커 <input type="text" name="ticker" placeholder="예: AAPL" required /></label>
            <label>마켓 <select name="market"><option value="US">미국 (US)</option><option value="KR">한국 (KR)</option></select></label>
            <div style="display: flex; align-items: flex-end;">
                <button class="button primary" style="width: 100%;" type="submit">GPT 분석 시작</button>
            </div>
        </form>
        <div id="reportGenerateMessage" class="notice"></div>
    </section>

    <section class="panel" style="transition: all 0.3s;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 style="margin: 0;">내 리포트 목록</h2>
                <p class="muted" style="margin: 0; font-size: 0.85rem;">저장된 리포트를 확인하세요.</p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="button ghost" onclick="loadReports()">새로고침</button>
                <button id="listToggleBtn" class="button ghost" onclick="toggleReportList()">
                    ▼ 펼치기
                </button>
            </div>
        </div>

        <div id="reportListContainer" class="hidden" style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <div id="reportList" class="list"></div>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <h2>상세 내용</h2>
            <p class="muted">위 목록에서 '보기'를 선택하거나 새로 생성하면 이곳에 표시됩니다.</p>
        </div>
        <div id="reportDetail" class="detail" style="min-height: 400px; border: none; padding: 0;">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; color: var(--text-muted);">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 1rem; opacity: 0.5;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p>분석 결과가 없습니다.</p>
            </div>
        </div>
    </section>
</main>

<script src="/js/app.js"></script>
<script>initReportsPage();</script>
</body>
</html>
