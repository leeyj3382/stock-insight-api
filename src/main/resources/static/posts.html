<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board | Stock Insight</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="site-header">
    <a href="/index.html" class="logo">SI<span>•</span> Stock Insight</a>
    <nav class="nav desktop-only">
        <a href="/index.html">Main</a>
        <a href="/reports.html" class="auth-user hidden">Reports</a>
        <a href="/posts.html" class="auth-user hidden active">Board</a>
    </nav>
    <div class="nav-actions">
        <div class="auth-guest" style="display: flex; gap: 0.5rem;">
            <a class="button ghost" href="/login.html">Login</a>
        </div>
        <div class="auth-user hidden" style="display: flex; gap: 0.5rem;">
            <span id="userNameDisplay" style="align-self:center; font-weight:600; margin-right:0.5rem; color:var(--primary);"></span>
            <button class="button ghost" onclick="logout()">Logout</button>
        </div>
        <button id="menuToggle" class="menu-toggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>
</header>

<nav id="mobileMenu" class="mobile-nav">
    <a href="/index.html">Main</a>
    <a href="/reports.html" class="auth-user hidden">Reports</a>
    <a href="/posts.html" class="auth-user hidden">Board</a>
</nav>

<main class="page">
    <section class="panel">
        <div class="panel-header">
            <h1>게시판 공유</h1>
            <p>회원끼리 리포트 인사이트를 공유하는 공간입니다.</p>
        </div>
        <form id="postCreateForm" class="form">
            <label>
                제목
                <input type="text" name="title" placeholder="AAPL 리포트 공유" required />
            </label>
            <label>
                내용
                <textarea name="content" rows="6" placeholder="인사이트를 공유해 주세요." required></textarea>
            </label>
            <button class="button primary" type="submit">게시글 작성</button>
        </form>
        <div id="postMessage" class="notice"></div>
    </section>

    <section class="panel" style="transition: all 0.3s;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 style="margin: 0;">전체 게시글</h2>
                <p class="muted" style="margin: 0; font-size: 0.85rem;">모든 사용자의 게시글을 확인할 수 있습니다.</p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="button ghost" onclick="loadAllPosts()">새로고침</button>
                <button id="allListToggleBtn" class="button ghost" onclick="toggleAllPostList()">
                    ▼ 펼치기
                </button>
            </div>
        </div>

        <div id="allPostListContainer" class="hidden" style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <div id="allPostList" class="list"></div>
        </div>
    </section>


    <section class="panel" style="transition: all 0.3s;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 style="margin: 0;">내 게시글</h2>
                <p class="muted" style="margin: 0; font-size: 0.85rem;">작성한 게시글 관리</p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="button ghost" onclick="loadPosts()">새로고침</button>
                <button id="myListToggleBtn" class="button ghost" onclick="toggleMyPostList()">
                    ▼ 펼치기
                </button>
            </div>
        </div>

        <div id="postListContainer" class="hidden" style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <div id="postList" class="list"></div>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <h2>상세 내용</h2>
            <p class="muted">목록에서 게시글을 선택하면 이곳에 표시됩니다.</p>
        </div>
        <div id="postDetailPanel" class="detail" style="min-height: 300px; border: none; padding: 0;">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; color: var(--text-muted);">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 1rem; opacity: 0.5;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p>선택된 게시글이 없습니다.</p>
            </div>
        </div>
    </section>
</main>

<script src="/js/app.js"></script>
<script>initPostsPage();</script>
</body>
</html>
